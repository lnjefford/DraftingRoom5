name: Dependabot auto-merge

on:
  workflow_run:
    workflows: [Android commit build]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge-update:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Merge the verified Dependabot update
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const sha = context.payload.workflow_run.head_sha;
            const pulls = await github.paginate(
              github.rest.repos.listPullRequestsAssociatedWithCommit,
              { owner, repo, commit_sha: sha }
            );
            const pull = pulls.find(candidate =>
              candidate.state === "open" &&
              candidate.base.ref === "main" &&
              candidate.head.sha === sha &&
              candidate.user.login === "dependabot[bot]" &&
              candidate.head.repo?.full_name === `${owner}/${repo}`
            );
            if (!pull) {
              core.info("The successful build does not belong to an open Dependabot pull request.");
              return;
            }
            const result = await github.rest.pulls.merge({
              owner,
              repo,
              pull_number: pull.number,
              sha,
              merge_method: "squash"
            });
            if (!result.data.merged) {
              core.setFailed(result.data.message || `Pull request #${pull.number} was not merged.`);
              return;
            }
            await github.rest.repos.createDispatchEvent({
              owner,
              repo,
              event_type: "dependabot-merged",
              client_payload: {
                pull_request: pull.number,
                merge_sha: result.data.sha
              }
            });
