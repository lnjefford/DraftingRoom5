name: Android release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Restore persistent signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Configure the Android signing secrets before releasing."; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/distribution.jks"
      - name: Build signed GitHub APKs and Google Play bundles
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/distribution.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Use a vMAJOR.MINOR.PATCH tag"; exit 1; }
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
          (( MAJOR < 2000 && MINOR < 1000 && PATCH < 1000 )) || exit 1
          BASE_CODE=$((10#$MAJOR * 1000000 + 10#$MINOR * 1000 + 10#$PATCH + 2))
          PHONE_CODE=$((BASE_CODE * 10))
          WEAR_CODE=$((BASE_CODE * 10 + 1))
          (( WEAR_CODE <= 2100000000 )) || { echo "Calculated version codes exceed Google Play's limit"; exit 1; }
          ./gradlew :app:assembleRelease :wear:assembleRelease :app:bundlePlay :wear:bundlePlay \
            -PappVersionName="$VERSION" -PphoneVersionCode="$PHONE_CODE" -PwearVersionCode="$WEAR_CODE"
          PLAY_MANIFEST=app/build/intermediates/bundle_manifest/play/processApplicationManifestPlayForBundle/AndroidManifest.xml
          ! grep -q 'android.permission.REQUEST_INSTALL_PACKAGES' "$PLAY_MANIFEST"
          ! grep -q 'dev.draftingroom5.updates' "$PLAY_MANIFEST"
          cp app/build/outputs/apk/release/app-release.apk DraftingRoom5.apk
          cp wear/build/outputs/apk/release/wear-release.apk DraftingRoom5-Wear.apk
          cp app/build/outputs/bundle/play/app-play.aab DraftingRoom5-Play.aab
          cp wear/build/outputs/bundle/play/wear-play.aab DraftingRoom5-Wear-Play.aab
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            DraftingRoom5.apk
            DraftingRoom5-Wear.apk
            DraftingRoom5-Play.aab
            DraftingRoom5-Wear-Play.aab
      - name: Publish phone bundle to Google Play internal testing
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: dev.draftingroom5
          releaseFiles: DraftingRoom5-Play.aab
          releaseName: ${{ github.ref_name }}
          tracks: internal
          status: completed
      - name: Publish watch bundle to Google Play Wear internal testing
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: dev.draftingroom5
          releaseFiles: DraftingRoom5-Wear-Play.aab
          releaseName: ${{ github.ref_name }}
          tracks: wear:internal
          status: completed
