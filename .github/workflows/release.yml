name: Android release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Restore persistent signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Configure the Android signing secrets before releasing."; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/distribution.jks"
      - name: Build signed APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/distribution.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Use a vMAJOR.MINOR.PATCH tag"; exit 1; }
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
          (( MAJOR < 2000 && MINOR < 1000 && PATCH < 1000 )) || exit 1
          CODE=$((10#$MAJOR * 1000000 + 10#$MINOR * 1000 + 10#$PATCH + 2))
          ./gradlew assembleRelease -PappVersionName="$VERSION" -PappVersionCode="$CODE"
          cp app/build/outputs/apk/release/app-release.apk DraftingRoom5.apk
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: DraftingRoom5.apk
