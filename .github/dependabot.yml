version: 2

updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: America/Chicago
    target-branch: main
    open-pull-requests-limit: 10
    labels:
      - dependencies
    groups:
      all-gradle-updates:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: America/Chicago
    target-branch: main
    open-pull-requests-limit: 10
    labels:
      - dependencies
    groups:
      all-actions-updates:
        patterns:
          - "*"
