version: 2

updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    target-branch: main
    open-pull-requests-limit: 10
    labels:
      - dependencies
    groups:
      gradle-patch-updates:
        update-types:
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    target-branch: main
    open-pull-requests-limit: 10
    labels:
      - dependencies
    groups:
      actions-patch-updates:
        update-types:
          - patch
